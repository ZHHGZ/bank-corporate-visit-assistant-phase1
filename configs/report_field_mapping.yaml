# ================================================================
# 9大模块字段映射台账 (v1.1 - 真实ESB响应路径版)
# 数据源: app/services.py 代码实现 + llm-standalone/configs/report_metric_mapping.yaml
# ================================================================
# source_type 枚举: 行外-中数智汇 | 行外-年报 | 行内-CRM | AI生成 | 规则生成 | 待定
# status      枚举: 已接入 | 部分接入 | 待接入 | 待确认 | 待补充
# compute     枚举: direct | first_non_empty | recursive_first | recursive_count | count_nonzero | multi_array_count | latest_by_year | join_by_key | derived | manual_confirm
# verified_by 枚举: current_code | current_code_partial | pending_bank_confirm | guessed
# ================================================================

